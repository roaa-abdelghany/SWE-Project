<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | Bloom Cosmetics</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='my_orders.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>My Orders</h1>
            <p>Track and manage your beauty essentials</p>
        </header>

        <table class="orders-table">
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Product</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                {% for order in orders %}
                <tr>
                    <td>#{{ order.id }}</td>
                    <td><strong>{{ order.product }}</strong></td>
                    <td>{{ order.date }}</td>
                    <td><span class="status {{ order.status.lower() }}">{{ order.status }}</span></td>
                    <td>${{ "%.2f"|format(order.price) }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
